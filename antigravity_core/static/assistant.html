<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
  <title>Antigravity — Quick Status</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100vw; min-height: 100vh; background: #0a0f1d; overscroll-behavior: none; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #dfe2f1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      gap: 18px;
    }
    .back-link { position: fixed; top: 16px; left: 16px; color: #64748b; font-size: 20px; text-decoration: none; }
    .ring {
      width: 96px; height: 96px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle, rgba(6,182,212,0.15), transparent 70%);
      border: 2px solid #06b6d4;
      font-size: 12px; font-weight: 700; color: #4cd7f6;
    }
    .ring.listening { animation: pulse 1.2s infinite; border-color: #f43f5e; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(244,63,94,0.4); } 50% { box-shadow: 0 0 0 14px rgba(244,63,94,0); } }
    h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #64748b; margin: 0; }
    #summaryText { font-size: 17px; line-height: 1.6; font-weight: 600; color: #fff; max-width: 420px; min-height: 60px; }
    #pendingList { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 380px; }
    .pending-item { background: #171b26; border: 1px solid #334155; border-radius: 10px; padding: 10px 14px; font-size: 13px; text-align: left; color: #cbd5e1; }
    .all-done { color: #34d399; font-weight: 700; font-size: 14px; }
    #micBtn {
      margin-top: 8px; min-height: 54px; padding: 0 28px; border-radius: 999px;
      background: #171b26; border: 2px solid #334155; color: #cbd5e1;
      font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 10px;
      cursor: pointer;
    }
    #micBtn.listening { border-color: #f43f5e; color: #f43f5e; }
    #banner { font-size: 12px; color: #f87171; background: rgba(244,63,94,0.1); border: 1px solid rgba(244,63,94,0.3); border-radius: 10px; padding: 10px 14px; max-width: 380px; display: none; }
    #enableOverlay {
      position: fixed; inset: 0; background: rgba(10,15,29,0.97); z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center;
    }
    #enableOverlay.hidden { display: none; }
    #enableBtn {
      min-height: 64px; padding: 0 32px; border-radius: 999px; background: linear-gradient(135deg,#06b6d4,#4f46e5);
      color: #fff; font-weight: 700; font-size: 14px; border: none; display: flex; align-items: center; gap: 10px; cursor: pointer;
    }
  </style>
</head>
<body>
  <a class="back-link" href="/"><i class="fa-solid fa-arrow-left"></i></a>

  <div id="enableOverlay">
    <i class="fa-solid fa-microphone-lines" style="font-size:40px;color:#4cd7f6;"></i>
    <p style="font-size:14px;max-width:300px;line-height:1.5;">Tap once to let this page listen automatically — after that, it'll speak your status and start listening for your voice every time you open it.</p>
    <button id="enableBtn" type="button"><i class="fa-solid fa-microphone"></i><span>Enable Voice Assistant</span></button>
  </div>

  <div class="ring" id="ring"><span id="ringLevel">--</span></div>
  <h1>Quick Status</h1>
  <p id="summaryText">Loading your status…</p>
  <div id="pendingList"></div>
  <button id="micBtn" type="button"><i class="fa-solid fa-microphone"></i><span>Ask "What's pending?"</span></button>
  <p id="banner"></p>

  <script>
    const TASK_LABELS = {
      study_completed: "Daily study target",
      leetcode_completed: "LeetCode problem",
      gym_completed: "Gym workout",
      english_completed: "English practice",
      cooking_completed: "Home cooking / meal prep",
      nopmo_completed: "NoPMO discipline",
      reading_completed: "Reading",
      health_completed: "Google Fit health sync",
      meditation_completed: "5-min meditation",
      canvas_semester_completed: "Semester course work",
      mindos_completed: "Mind OS reality check"
    };

    let lastStats = null;

    function speak(text, onDone) {
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 1.02;
        if (onDone) { u.onend = onDone; u.onerror = onDone; }
        window.speechSynthesis.speak(u);
        // Some browsers never fire onend reliably — fall back after a timeout matched to text length.
        if (onDone) setTimeout(onDone, Math.min(12000, 1200 + text.length * 55));
      } catch (e) {
        if (onDone) onDone();
      }
    }

    function buildSummary(d) {
      const pending = Object.entries(TASK_LABELS).filter(([key]) => !d[key]).map(([, label]) => label);
      const level = d.level ?? '--';
      const xp = d.xp ?? 0;
      const streak = d.streak_days ?? 0;

      let text = `Hey! You're level ${level} with ${xp} XP, and a ${streak}-day streak. `;
      text += pending.length
        ? `You still have ${pending.length} thing${pending.length === 1 ? '' : 's'} pending today: ${pending.join(', ')}.`
        : `You've cleared everything on today's checklist — nice work.`;
      return { text, pending };
    }

    async function loadStatus(andSpeak) {
      try {
        const r = await fetch('/stats');
        const d = await r.json();
        lastStats = d;

        document.getElementById('ringLevel').textContent = `LV ${d.level ?? '--'}`;
        const { text, pending } = buildSummary(d);
        document.getElementById('summaryText').textContent = text;

        const list = document.getElementById('pendingList');
        list.innerHTML = pending.length
          ? pending.map(p => `<div class="pending-item"><i class="fa-solid fa-circle-exclamation" style="color:#f59e0b;margin-right:8px;"></i>${p}</div>`).join('')
          : `<div class="all-done"><i class="fa-solid fa-circle-check"></i> All caught up for today!</div>`;

        if (andSpeak) {
          // Speak first, THEN start listening — otherwise the mic picks up the app's own voice.
          speak(text, () => startListening());
        }
      } catch (e) {
        document.getElementById('summaryText').textContent = 'Could not load status — check your connection.';
      }
    }

    // ─── Voice command: say "Hi" / ask about level / pending tasks ──────────
    let recognizer = null;
    let isListening = false;
    let voiceLoopActive = false;

    function respondToCommand(transcript) {
      const t = transcript.toLowerCase();
      if (!lastStats) { speak("Still loading your status, one second.", () => startListening()); return; }
      const { text, pending } = buildSummary(lastStats);

      let reply;
      if (t.includes('pending') || t.includes('task') || t.includes('todo')) {
        reply = pending.length ? `Pending: ${pending.join(', ')}.` : "You're all caught up — nothing pending today.";
      } else if (t.includes('level') || t.includes('xp') || t.includes('streak')) {
        reply = `You're level ${lastStats.level}, ${lastStats.xp} XP, ${lastStats.streak_days}-day streak.`;
      } else if (t.includes('stop') || t.includes('bye') || t.includes('goodbye')) {
        voiceLoopActive = false;
        speak("Okay, signing off.");
        return;
      } else {
        reply = text;
      }
      // Keep the conversation going — listen again after replying.
      speak(reply, () => { if (voiceLoopActive) startListening(); });
    }

    function initMic() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const btn = document.getElementById('micBtn');
      const banner = document.getElementById('banner');
      if (!SR) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        banner.style.display = 'block';
        banner.textContent = "Voice commands aren't supported in this browser — the status above still loads and reads itself aloud automatically.";
        document.getElementById('enableOverlay').classList.add('hidden');
        return true;
      }
      recognizer = new SR();
      recognizer.continuous = false;
      recognizer.interimResults = false;
      recognizer.lang = 'en-US';

      recognizer.onresult = (e) => {
        const said = e.results[e.results.length - 1][0].transcript;
        respondToCommand(said);
      };
      recognizer.onerror = (e) => {
        setListening(false);
        if (e.error === 'not-allowed' || e.error === 'permission-denied' || e.error === 'service-not-allowed') {
          voiceLoopActive = false;
          document.getElementById('enableOverlay').classList.remove('hidden');
          banner.style.display = 'block';
          banner.textContent = 'Microphone access was blocked. Tap "Enable Voice Assistant" and allow the permission prompt.';
        } else if (e.error === 'no-speech' && voiceLoopActive) {
          // Silence timeout — just keep the loop alive quietly.
          startListening();
        }
      };
      recognizer.onend = () => { setListening(false); };

      btn.addEventListener('click', () => {
        if (isListening) { voiceLoopActive = false; recognizer.stop(); return; }
        voiceLoopActive = true;
        startListening();
      });
      return true;
    }

    function startListening() {
      if (!recognizer || isListening) return;
      try { recognizer.start(); setListening(true); }
      catch (e) { /* already running, or blocked — onerror handles the latter */ }
    }

    function setListening(on) {
      isListening = on;
      document.getElementById('ring').classList.toggle('listening', on);
      document.getElementById('micBtn').classList.toggle('listening', on);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const hasMic = initMic();
      await loadStatus(false);

      const overlay = document.getElementById('enableOverlay');
      const enableBtn = document.getElementById('enableBtn');

      if (!hasMic || !recognizer) {
        overlay.classList.add('hidden');
        const { text } = buildSummary(lastStats || {});
        speak(text);
        return;
      }

      // Speak first (always works, no permission needed), then try to auto-start
      // listening. If the browser blocks a mic-permission prompt without a prior
      // tap, recognizer.onerror('not-allowed') fires and reveals the enable button.
      overlay.classList.add('hidden');
      voiceLoopActive = true;
      const { text } = buildSummary(lastStats || {});
      speak(text, () => startListening());

      enableBtn.addEventListener('click', () => {
        overlay.classList.add('hidden');
        voiceLoopActive = true;
        startListening();
      });
    });
  </script>
</body>
</html>
